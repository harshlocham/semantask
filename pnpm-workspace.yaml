packages:
  - "apps/*"
  - "packages/*"

# pnpm 11: allow packages that ship install/build scripts we rely on.
allowBuilds:
  esbuild: true
  mongodb-memory-server: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - brace-expansion@1.1.18
  - brace-expansion@2.1.4
  - brace-expansion@3.0.6
  - brace-expansion@5.0.9
  - socket.io-parser@4.2.7
  - ip-address@10.3.1
  - js-yaml@3.15.2
  - js-yaml@4.3.2
  - js-yaml@5.2.1
  - "@xmldom/xmldom@0.8.15"
  - "@xmldom/xmldom@0.9.12"
  - next@15.5.24
  - nodemailer@9.1.0
  - sharp@0.35.4
  - nanoid@3.3.18
  - nanoid@5.1.16
  - tar@7.5.22
  - browserslist@4.28.7

# npm advisory range is still <=5.0.7 / >=5.0.8, so it falsely flags
# patched 1.1.18 / 2.1.4 backports (GHSA-mh99-v99m-4gvg).
# image-size GHSA-w3rx-r6r6-pgpr / GHSA-5p2g-fcmc-qvqq: first_patched_version is
# null; no npm release >2.0.2 exists yet (metro still on 1.2.1 / latest 2.0.2).
auditConfig:
  ignoreGhsas:
    - GHSA-mh99-v99m-4gvg
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq

overrides:
  react: "19.1.0"
  react-dom: "19.1.0"
  next: "15.5.24"
  prettier: "^3.6.2"
  shell-quote: "^1.9.0"
  postcss: "^8.5.18"
  esbuild: "^0.28.1"
  jest-mock: "30.4.1"
  # GHSA-r292-9mhp-454m — node-tar mapHas stack-overflow DoS
  tar: "^7.5.21"
  sharp: "^0.35.4"
  axios: "^1.18.0"
  # GHSA-mh99-v99m-4gvg / GHSA-rgw5-rvv9-x895 — keep each major on its patched line for minimatch compat.
  "brace-expansion@<1.1.18": "1.1.18"
  "brace-expansion@>=2.0.0 <2.1.4": "2.1.4"
  "brace-expansion@>=3.0.0 <3.0.6": "3.0.6"
  "brace-expansion@>=4.0.0 <5.0.9": "5.0.9"
  "browserslist@<=4.28.6": "4.28.7"
  # GHSA-2m8v-j782-fhvr — socket.io(-client) still pulls parser <4.2.7
  "socket.io-parser@>=4.0.0 <4.2.7": "4.2.7"
  # GHSA-mwp4-54f8-5fhr — socks → ip-address <=10.3.0
  "ip-address@<=10.3.0": "10.3.1"
  # GHSA-5p4m-2wfm-xmqj / GHSA-2883-xcg3-v3hh — keep each major on patched line
  "js-yaml@>=3 <3.15.2": "3.15.2"
  "js-yaml@>=4 <4.3.2": "4.3.2"
  "js-yaml@>=5 <5.2.1": "5.2.1"
  # xmldom injection / ReDoS / quadratic parse — keep 0.8 and 0.9 on patched lines
  "@xmldom/xmldom@>=0.7.0 <0.8.15": "0.8.15"
  "@xmldom/xmldom@>=0.9.0 <0.9.12": "0.9.12"
  "ws@>=6.0.0 <6.2.4": "^6.2.4"
  "ws@>=7.0.0 <7.5.11": "^7.5.11"
  "ws@>=8.0.0 <8.21.0": "^8.21.0"
  "xcode>uuid": "^11.1.1"
  form-data: "^4.0.6"
  undici: "^6.27.0"
  # GHSA-28wg-ghj8-5hjv / GHSA-2v37-7h3g-55p8 — nanoid infinite loop
  "nanoid@<3.3.17": "3.3.18"
  "nanoid@>=4.0.0 <5.1.16": "5.1.16"
