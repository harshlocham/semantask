# Production: HTTPS behind Cloudflare Full (strict). Used by docker-compose.prod.yml.
# Local and staging stacks keep using nginx/default.conf on plain HTTP.

# Docker embedded DNS — re-resolve container IPs after recreates (avoids 502 stale upstream).
resolver 127.0.0.11 valid=10s ipv6=off;

include /etc/nginx/cloudflare-real-ip.conf;

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Drop anything that does not name this site, such as scans of the server's IP address.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 80;
    server_name semantask.com www.semantask.com;
    return 301 https://semantask.com$request_uri;
}

server {
    listen 443 ssl;
    server_name www.semantask.com;

    ssl_certificate /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://semantask.com$request_uri;
}

server {
    listen 443 ssl;
    server_name semantask.com;

    ssl_certificate /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /api/socket {
        set $socket_upstream http://socket:3001;
        proxy_pass $socket_upstream;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, because auth rate limits key on the first value and a client can send its own.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    location / {
        set $nextapp_upstream http://nextapp:3000;
        proxy_pass $nextapp_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
